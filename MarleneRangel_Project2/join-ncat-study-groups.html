    <img src="study_group.jpg" alt="Study Group Session" style="width:100%; max-width:600px; display:block; margin:auto;">
    <main>
        <h2>Register for Study Groups</h2>
        <p>Fill out the form below to join a study group based on your courses:</p>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Student Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="course">Course or major:</label>
            <input type="text" id="course" name="course" required><br><br>
            <input type="submit" value="Register">
        </form>
    </main>
